---
name: Renovate

on:
  schedule:
    # Every day at 04:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
      dryRun:
        description: 'Run without creating branches, PRs or issues'
        required: false
        default: false
        type: boolean

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.2.2
        with: {}
          # Needs a PAT (repo + workflow scope) or a GitHub App token, not the
          # default GITHUB_TOKEN: that one may neither update files below
          # .github/workflows nor trigger the CI workflows on the PRs it opens.
          # Currently disabled for testing purposes
          # token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Configuration lives in .github/renovate.json5, no onboarding PR.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
